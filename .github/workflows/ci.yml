name: Kawaii Matrix CI Pipeline 🌸

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]

jobs:
  build-and-test:
    # Bật ma trận hệ điều hành lên nè Senpai! ✨
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    
    # Workflow sẽ chạy lần lượt trên từng OS được định nghĩa ở trên đó 🎶
    runs-on: ${{ matrix.os }}

    steps:
    - name: Lấy code về nha 📥
      uses: actions/checkout@v4

    - name: Cài đặt môi trường Java 17 ☕
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    - name: Chạy Test với Maven 🚀
      # Em chỉ chạy test thôi để kiểm tra nha
      run: mvn -B clean test